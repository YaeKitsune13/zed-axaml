name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ls:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build axaml-ls
        working-directory: axaml-ls
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package archive (Unix)
        if: matrix.ext == 'tar.gz'
        working-directory: axaml-ls/target/${{ matrix.target }}/release
        run: tar -czf ../../../../axaml-ls-${{ matrix.target }}.tar.gz axaml-ls

      - name: Package archive (Windows)
        if: matrix.ext == 'zip'
        working-directory: axaml-ls/target/${{ matrix.target }}/release
        run: Compress-Archive -Path axaml-ls.exe -DestinationPath ../../../../axaml-ls-${{ matrix.target }}.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: axaml-ls-${{ matrix.target }}.${{ matrix.ext }}

  build-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Download Avalonia NuGet & generate meta.json
        run: |
          mkdir -p /tmp/avalonia_pkg
          curl -sL "https://www.nuget.org/api/v2/package/Avalonia" -o /tmp/avalonia.nupkg
          unzip -q /tmp/avalonia.nupkg -d /tmp/avalonia_pkg
          DLL_DIR=$(find /tmp/avalonia_pkg/lib -maxdepth 1 -type d | sort -V | tail -n 1)
          cargo run --release --manifest-path axaml-meta/Cargo.toml -- "$DLL_DIR" > meta.json

      - uses: softprops/action-gh-release@v2
        with:
          files: meta.json
